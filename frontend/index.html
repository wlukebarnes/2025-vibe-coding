<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo App - 2025 Vibe Coding</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
                min-height: 100vh;
                color: #e9ecef;
            }

            .container {
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
            }

            .header {
                text-align: center;
                margin-bottom: 30px;
            }

            .header h1 {
                color: white;
                font-size: 2.5rem;
                margin-bottom: 10px;
                font-weight: 300;
            }

            .header p {
                color: rgba(255, 255, 255, 0.8);
                font-size: 1.1rem;
            }

            .app-card {
                background: #2d3748;
                border-radius: 12px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                overflow: hidden;
                border: 1px solid #4a5568;
            }

            .tabs {
                display: flex;
                background: #1a202c;
                border-bottom: 1px solid #4a5568;
            }

            .tab {
                flex: 1;
                padding: 15px 20px;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s ease;
                font-weight: 500;
                color: #a0aec0;
            }

            .tab.active {
                background: #2d3748;
                color: #ff6b35;
                border-bottom: 3px solid #ff6b35;
            }

            .tab:hover:not(.active) {
                background: #4a5568;
                color: #e2e8f0;
            }

            .tab-content {
                display: none;
            }

            .tab-content.active {
                display: block;
            }

            .create-form {
                padding: 25px;
                background: #1a202c;
                border-bottom: 1px solid #4a5568;
            }

            .form-group {
                margin-bottom: 15px;
            }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: 500;
                color: #e2e8f0;
            }

            .form-group input,
            .form-group textarea {
                width: 100%;
                padding: 12px;
                border: 1px solid #4a5568;
                border-radius: 6px;
                font-size: 14px;
                transition: border-color 0.3s ease;
                background: #2d3748;
                color: #e9ecef;
            }

            .form-group input:focus,
            .form-group textarea:focus {
                outline: none;
                border-color: #ff6b35;
                box-shadow: 0 0 0 2px rgba(255, 107, 53, 0.25);
            }

            .form-group textarea {
                resize: vertical;
                min-height: 80px;
            }

            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: all 0.3s ease;
            }

            .btn-primary {
                background: #ff6b35;
                color: white;
            }

            .btn-primary:hover {
                background: #e55a2b;
                transform: translateY(-1px);
            }

            .btn-success {
                background: #48bb78;
                color: white;
            }

            .btn-success:hover {
                background: #38a169;
            }

            .btn-danger {
                background: #e53e3e;
                color: white;
            }

            .btn-danger:hover {
                background: #c53030;
            }

            .btn-secondary {
                background: #718096;
                color: white;
            }

            .btn-secondary:hover {
                background: #5a6772;
            }

            .todo-list {
                padding: 0;
            }

            .todo-item {
                display: flex;
                align-items: center;
                padding: 20px;
                border-bottom: 1px solid #4a5568;
                transition: background-color 0.2s ease;
            }

            .todo-item:hover {
                background: #4a5568;
            }

            .todo-item:last-child {
                border-bottom: none;
            }

            .todo-checkbox {
                margin-right: 15px;
                width: 18px;
                height: 18px;
                cursor: pointer;
            }

            .todo-content {
                flex: 1;
                cursor: pointer;
            }

            .todo-title {
                font-size: 16px;
                font-weight: 500;
                margin-bottom: 4px;
                color: #e9ecef;
            }

            .todo-description {
                font-size: 14px;
                color: #a0aec0;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .todo-meta {
                font-size: 12px;
                color: #718096;
                margin-top: 5px;
            }

            .todo-status {
                padding: 4px 8px;
                border-radius: 12px;
                font-size: 11px;
                font-weight: 500;
                text-transform: uppercase;
            }

            .status-pending {
                background: #fff3cd;
                color: #856404;
            }

            .status-completed {
                background: #d4edda;
                color: #155724;
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #a0aec0;
            }

            .empty-state h3 {
                margin-bottom: 10px;
                color: #e2e8f0;
            }

            /* Modal Styles */
            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
            }

            .modal-content {
                background: #2d3748;
                margin: 5% auto;
                padding: 30px;
                border-radius: 12px;
                width: 90%;
                max-width: 500px;
                position: relative;
                border: 1px solid #4a5568;
            }

            .modal-close {
                position: absolute;
                top: 15px;
                right: 20px;
                font-size: 24px;
                cursor: pointer;
                color: #a0aec0;
            }

            .modal-close:hover {
                color: #e2e8f0;
            }

            .modal h2 {
                margin-bottom: 20px;
                color: #e9ecef;
            }

            .modal-actions {
                display: flex;
                gap: 10px;
                margin-top: 20px;
            }

            .loading {
                text-align: center;
                padding: 40px;
                color: #a0aec0;
            }

            .error-message {
                background: #742a2a;
                color: #fca5a5;
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 15px;
                border: 1px solid #dc2626;
            }

            .success-message {
                background: #2f6b2f;
                color: #86efac;
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 15px;
                border: 1px solid #16a34a;
            }

            /* Responsive Design */
            @media (max-width: 768px) {
                .container {
                    padding: 15px;
                }

                .header h1 {
                    font-size: 2rem;
                }

                .modal-content {
                    margin: 10% auto;
                    padding: 20px;
                }

                .modal-actions {
                    flex-direction: column;
                }

                .modal-actions .btn {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>📝 Todo App</h1>
                <p>Organize your tasks with style</p>
            </div>

            <div class="app-card">
                <!-- Tabs -->
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('active')">Active Tasks</div>
                    <div class="tab" onclick="switchTab('all')">All Tasks</div>
                </div>

                <!-- Create Form -->
                <div class="create-form">
                    <div class="form-group">
                        <label for="title">Task Title *</label>
                        <input type="text" id="title" placeholder="What needs to be done?" required />
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Add more details..."></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createTodo()">
                        <span id="createBtnText">Create Task</span>
                    </button>
                </div>

                <!-- Tab Content -->
                <div id="activeTab" class="tab-content active">
                    <div id="activeTodos" class="todo-list">
                        <div class="loading">Loading tasks...</div>
                    </div>
                </div>

                <div id="allTab" class="tab-content">
                    <div id="allTodos" class="todo-list">
                        <div class="loading">Loading tasks...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Todo Detail Modal -->
        <div id="todoModal" class="modal">
            <div class="modal-content">
                <span class="modal-close" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle">Task Details</h2>

                <div id="modalContent">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="editTitle" required />
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="editDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus">
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-success" onclick="updateTodo()">Update</button>
                    <button class="btn btn-danger" onclick="deleteTodo()">Delete</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        </div>

        <script>
            let currentTab = 'active';
            let currentTodoId = null;

            // Initialize app
            document.addEventListener('DOMContentLoaded', function () {
                loadTodos();
            });

            // Switch between tabs
            function switchTab(tab) {
                currentTab = tab;

                // Update tab UI
                document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach((c) => c.classList.remove('active'));

                if (tab === 'active') {
                    document.querySelectorAll('.tab')[0].classList.add('active');
                    document.getElementById('activeTab').classList.add('active');
                } else {
                    document.querySelectorAll('.tab')[1].classList.add('active');
                    document.getElementById('allTab').classList.add('active');
                }

                loadTodos();
            }

            // Load todos based on current tab
            async function loadTodos() {
                const listId = currentTab === 'active' ? 'activeTodos' : 'allTodos';
                const listElement = document.getElementById(listId);

                listElement.innerHTML = '<div class="loading">Loading tasks...</div>';

                try {
                    const includeCompleted = currentTab === 'all';
                    const response = await fetch(`/api/todos?include_completed=${includeCompleted}`);

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const todos = await response.json();
                    renderTodos(todos, listId);
                } catch (error) {
                    listElement.innerHTML = `<div class="error-message">❌ Error loading tasks: ${error.message}</div>`;
                }
            }

            // Render todos list
            function renderTodos(todos, listId) {
                const listElement = document.getElementById(listId);

                if (todos.length === 0) {
                    listElement.innerHTML = `
                    <div class="empty-state">
                        <h3>No tasks found</h3>
                        <p>${currentTab === 'active' ? 'Create your first task above!' : 'No tasks have been created yet.'}</p>
                    </div>
                `;
                    return;
                }

                const html = todos
                    .map(
                        (todo) => `
                <div class="todo-item">
                    <input type="checkbox"
                           class="todo-checkbox"
                           ${todo.status === 'completed' ? 'checked' : ''}
                           onchange="toggleTodoStatus(${todo.id}, this.checked)">
                    <div class="todo-content" onclick="openTodoModal(${todo.id})">
                        <div class="todo-title">${escapeHtml(todo.title)}</div>
                        ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                        <div class="todo-meta">
                            <span class="todo-status status-${todo.status}">${todo.status}</span>
                            • ${new Date(todo.created_at).toLocaleDateString()}
                        </div>
                    </div>
                </div>
            `
                    )
                    .join('');

                listElement.innerHTML = html;
            }

            // Create new todo
            async function createTodo() {
                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();

                if (!title) {
                    showMessage('Please enter a task title', 'error');
                    return;
                }

                const createBtn = document.getElementById('createBtnText');
                const originalText = createBtn.textContent;
                createBtn.textContent = 'Creating...';

                try {
                    const response = await fetch('/api/todos', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            title: title,
                            description: description,
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    // Clear form
                    document.getElementById('title').value = '';
                    document.getElementById('description').value = '';

                    showMessage('Task created successfully!', 'success');
                    loadTodos();
                } catch (error) {
                    showMessage(`Error creating task: ${error.message}`, 'error');
                } finally {
                    createBtn.textContent = originalText;
                }
            }

            // Toggle todo status
            async function toggleTodoStatus(todoId, completed) {
                const status = completed ? 'completed' : 'pending';

                try {
                    const response = await fetch(`/api/todos/${todoId}/status?status=${status}`, {
                        method: 'PUT',
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    loadTodos();
                } catch (error) {
                    showMessage(`Error updating task: ${error.message}`, 'error');
                    // Revert checkbox
                    event.target.checked = !completed;
                }
            }

            // Open todo modal for editing
            async function openTodoModal(todoId) {
                currentTodoId = todoId;

                try {
                    const response = await fetch(`/api/todos/${todoId}`);

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const todo = await response.json();

                    document.getElementById('editTitle').value = todo.title;
                    document.getElementById('editDescription').value = todo.description || '';
                    document.getElementById('editStatus').value = todo.status;

                    document.getElementById('todoModal').style.display = 'block';
                } catch (error) {
                    showMessage(`Error loading task: ${error.message}`, 'error');
                }
            }

            // Update todo
            async function updateTodo() {
                const title = document.getElementById('editTitle').value.trim();
                const description = document.getElementById('editDescription').value.trim();
                const status = document.getElementById('editStatus').value;

                if (!title) {
                    showMessage('Please enter a task title', 'error');
                    return;
                }

                try {
                    const response = await fetch(`/api/todos/${currentTodoId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            title: title,
                            description: description,
                        }),
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    // Update status separately if changed
                    if (status !== 'pending') {
                        // assuming default is pending
                        await fetch(`/api/todos/${currentTodoId}/status?status=${status}`, {
                            method: 'PUT',
                        });
                    }

                    closeModal();
                    showMessage('Task updated successfully!', 'success');
                    loadTodos();
                } catch (error) {
                    showMessage(`Error updating task: ${error.message}`, 'error');
                }
            }

            // Delete todo
            async function deleteTodo() {
                if (!confirm('Are you sure you want to delete this task?')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/todos/${currentTodoId}`, {
                        method: 'DELETE',
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    closeModal();
                    showMessage('Task deleted successfully!', 'success');
                    loadTodos();
                } catch (error) {
                    showMessage(`Error deleting task: ${error.message}`, 'error');
                }
            }

            // Close modal
            function closeModal() {
                document.getElementById('todoModal').style.display = 'none';
                currentTodoId = null;
            }

            // Show message
            function showMessage(message, type) {
                // Remove existing messages
                const existingMessages = document.querySelectorAll('.error-message, .success-message');
                existingMessages.forEach((msg) => msg.remove());

                // Create new message
                const messageDiv = document.createElement('div');
                messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
                messageDiv.textContent = message;

                // Insert at top of create form
                const createForm = document.querySelector('.create-form');
                createForm.insertBefore(messageDiv, createForm.firstChild);

                // Auto-remove after 5 seconds
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.remove();
                    }
                }, 5000);
            }

            // Escape HTML to prevent XSS
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Close modal when clicking outside
            window.onclick = function (event) {
                const modal = document.getElementById('todoModal');
                if (event.target === modal) {
                    closeModal();
                }
            };
        </script>
    </body>
</html>
